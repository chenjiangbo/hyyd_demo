<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>寰宇医道探针</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        width: 340px;
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC',
          'Microsoft YaHei', '微软雅黑', sans-serif;
        font-size: 13px;
        color: #1f2937;
        padding: 14px 16px;
        background: #f9fafb;
      }
      .header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
      .header h1 { font-size: 14px; font-weight: 600; }
      .header .ver { font-size: 11px; color: #9ca3af; }
      .row { display: flex; align-items: center; padding: 6px 0; font-size: 12px; }
      .row .label { width: 60px; color: #6b7280; }
      .row .value { color: #1f2937; flex: 1; }
      .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
      .dot-green { background: #10b981; }
      .dot-red { background: #ef4444; }
      .dot-amber { background: #f59e0b; }
      .dot-gray { background: #9ca3af; }
      .separator { height: 1px; background: #e5e7eb; margin: 10px 0; }
      .config-section { padding: 10px; background: #fff; border: 1px solid #e5e7eb; border-radius: 6px; }
      .config-section label { display: block; margin-bottom: 8px; }
      .config-section label span { display: block; color: #6b7280; font-size: 11px; margin-bottom: 4px; }
      .config-section input { width: 100%; border: 1px solid #d1d5db; border-radius: 4px; padding: 6px 8px; font-size: 12px; }
      .config-section button { width: 100%; border: 0; border-radius: 4px; padding: 7px 8px; background: #059669; color: white; font-size: 12px; cursor: pointer; }
      .debug-section { padding: 10px; background: #fff7ed; border: 1px solid #fed7aa; border-radius: 6px; }
      .debug-title { font-size: 12px; font-weight: 600; color: #9a3412; margin-bottom: 8px; }
      .debug-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .debug-buttons button { border: 0; border-radius: 4px; padding: 7px 8px; color: #fff; font-size: 12px; cursor: pointer; }
      .debug-buttons.wide { grid-template-columns: 1fr; margin-top: 8px; }
      .debug-buttons.three { grid-template-columns: 1fr 1fr 1fr; margin-top: 8px; }
      #toggle-collect { background: #d97706; }
      #clear-cache { background: #dc2626; }
      #start-tracking-analysis { background: #2563eb; }
      #start-missing-tracking-analysis { background: #1d4ed8; }
      #start-tracking-zh-register { background: #0f766e; }
      #start-tracking-zh-green { background: #0d9488; }
      #refresh-tracking-analysis { background: #4b5563; }
      #download-tracking-analysis { background: #059669; }
      #clear-tracking-analysis { background: #7c2d12; }
      #start-edit-probe { background: #0f766e; }
      #scan-edit-page { background: #0369a1; }
      #start-edit-auto-trial { background: #7c3aed; }
      #start-edit-register-personal { background: #7c3aed; }
      #start-edit-green-personal { background: #6d28d9; }
      #start-edit-case-service { background: #5b21b6; }
      #start-edit-batch-register-personal { background: #4338ca; }
      #start-edit-batch-green-personal { background: #3730a3; }
      #start-edit-batch-case-service { background: #312e81; }
      #download-edit-analysis { background: #059669; }
      #clear-edit-analysis { background: #7c2d12; }
      .debug-note { margin-top: 8px; color: #9a3412; font-size: 11px; line-height: 1.45; }
      .analysis-status { margin-top: 8px; color: #374151; font-size: 11px; line-height: 1.45; word-break: break-word; }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>寰宇医道探针</h1>
      <span class="ver" id="ver">v1.2.13</span>
    </div>

    <div class="row">
      <span class="label">后端</span>
      <span class="value">
        <span class="dot dot-gray" id="ws-dot"></span>
        <span id="ws-text">检查中…</span>
      </span>
    </div>
    <div class="row">
      <span class="label">泰康标签</span>
      <span class="value">
        <span class="dot dot-gray" id="tk-dot"></span>
        <span id="tk-text">检查中…</span>
      </span>
    </div>
    <div class="row">
      <span class="label">泰康账号</span>
      <span class="value" id="tk-account-text">检查中…</span>
    </div>

    <div class="separator"></div>

    <div class="debug-section">
      <div class="debug-title">调试工具</div>
      <div class="row">
        <span class="label">采集</span>
        <span class="value">
          <span class="dot dot-gray" id="collect-dot"></span>
          <span id="collect-text">检查中…</span>
        </span>
      </div>
      <div class="debug-buttons">
        <button id="toggle-collect">暂停采集</button>
        <button id="clear-cache">清理本地缓存</button>
      </div>
      <div class="debug-buttons wide">
        <button id="start-tracking-analysis">开始追踪池分析</button>
      </div>
      <div class="debug-buttons">
        <button id="start-tracking-zh-register">梳理挂号追踪池</button>
        <button id="start-tracking-zh-green">梳理绿通追踪池</button>
      </div>
      <div class="debug-buttons wide">
        <button id="start-missing-tracking-analysis">深挖缺失类型</button>
      </div>
      <div class="debug-buttons three">
        <button id="refresh-tracking-analysis">状态</button>
        <button id="download-tracking-analysis">下载</button>
        <button id="clear-tracking-analysis">清除</button>
      </div>
      <div class="analysis-status" id="tracking-analysis-status">追踪池分析：未检查</div>
      <div class="debug-note">清理会删除本机订单指纹缓存；下次恢复采集会重新按后端基线/泰康状态判断。</div>
    </div>

    <div class="separator"></div>

    <div class="debug-section">
      <div class="debug-title">编辑页只读分析</div>
      <div class="debug-buttons">
        <button id="start-edit-probe">开始监听</button>
        <button id="scan-edit-page">扫描当前页</button>
      </div>
      <div class="debug-buttons wide">
        <button id="start-edit-auto-trial">自动试跑1单</button>
      </div>
      <div class="debug-buttons wide">
        <button id="start-edit-register-personal">梳理挂号个人池</button>
      </div>
      <div class="debug-buttons">
        <button id="start-edit-green-personal">梳理绿通个人池</button>
        <button id="start-edit-case-service">梳理个案服务待办</button>
      </div>
      <div class="debug-buttons wide">
        <button id="start-edit-batch-register-personal">批量挂号个人池</button>
      </div>
      <div class="debug-buttons">
        <button id="start-edit-batch-green-personal">批量绿通个人池</button>
        <button id="start-edit-batch-case-service">批量个案服务待办</button>
      </div>
      <div class="debug-buttons">
        <button id="download-edit-analysis">下载结果</button>
        <button id="clear-edit-analysis">清除结果</button>
      </div>
      <div class="analysis-status" id="edit-analysis-status">编辑页分析：未检查</div>
      <div class="debug-note">只记录字段名、控件状态和接口字段结构；不读取输入值，不保存、不提交。</div>
    </div>

    <div class="separator"></div>

    <div class="config-section">
      <label>
        <span>后端 WS</span>
        <input id="backend-ws-url" placeholder="ws://server:13000/ws" />
      </label>
      <button id="save-config">保存后端地址</button>
    </div>

    <script src="popup.global.js"></script>
  </body>
</html>
