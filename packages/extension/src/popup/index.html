<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>寰宇医道探针</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        width: 320px;
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC',
          'Microsoft YaHei', '微软雅黑', sans-serif;
        font-size: 13px;
        color: #1f2937;
        padding: 14px 16px;
        background: #f9fafb;
      }
      .header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
      .header h1 { font-size: 14px; font-weight: 600; }
      .header .ver { font-size: 11px; color: #9ca3af; }
      .row { display: flex; align-items: center; padding: 6px 0; font-size: 12px; }
      .row .label { width: 60px; color: #6b7280; }
      .row .value { color: #1f2937; flex: 1; }
      .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
      .dot-green { background: #10b981; }
      .dot-red { background: #ef4444; }
      .dot-gray { background: #9ca3af; }
      .separator { height: 1px; background: #e5e7eb; margin: 10px 0; }
      .config-section { padding: 10px; background: #fff; border: 1px solid #e5e7eb; border-radius: 6px; }
      .config-section label { display: block; margin-bottom: 8px; }
      .config-section label span { display: block; color: #6b7280; font-size: 11px; margin-bottom: 4px; }
      .config-section input { width: 100%; border: 1px solid #d1d5db; border-radius: 4px; padding: 6px 8px; font-size: 12px; }
      .config-section button { width: 100%; border: 0; border-radius: 4px; padding: 7px 8px; background: #059669; color: white; font-size: 12px; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>寰宇医道探针</h1>
      <span class="ver" id="ver">v1.2.0</span>
    </div>

    <div class="row">
      <span class="label">后端</span>
      <span class="value">
        <span class="dot dot-gray" id="ws-dot"></span>
        <span id="ws-text">检查中…</span>
      </span>
    </div>
    <div class="row">
      <span class="label">泰康标签</span>
      <span class="value">
        <span class="dot dot-gray" id="tk-dot"></span>
        <span id="tk-text">检查中…</span>
      </span>
    </div>

    <div class="separator"></div>

    <div class="config-section">
      <label>
        <span>后端 WS</span>
        <input id="backend-ws-url" placeholder="ws://server:13000/ws" />
      </label>
      <label>
        <span>员工 ID</span>
        <input id="employee-code" placeholder="zhangsan" />
      </label>
      <button id="save-config">保存配置</button>
    </div>

    <script src="popup.global.js"></script>
  </body>
</html>
